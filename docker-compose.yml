services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paytm
      POSTGRES_PASSWORD: paytm
      POSTGRES_DB: paytm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytm -d paytm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - paytm-pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://paytm:paytm@postgres:5432/paytm
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-compose-jwt-secret-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-compose-admin-token}
      PG_POOL_MAX: "20"
      HOLD_TTL_SECONDS: "120"
      DEFAULT_PER_USER_LIMIT: "4"
      LOG_LEVEL: info

volumes:
  paytm-pgdata:
