name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paytm
          POSTGRES_PASSWORD: paytm
          POSTGRES_DB: paytm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paytm -d paytm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://paytm:paytm@localhost:5432/paytm
      JWT_SECRET: ci-jwt-secret
      ADMIN_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  docker-burst:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the stack
        run: docker compose up -d --build
        env:
          JWT_SECRET: ci-compose-jwt-secret
          ADMIN_TOKEN: ci-compose-admin-token
      - name: Wait for /readyz
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/readyz; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "service never became ready"
          docker compose logs
          exit 1
      - name: Run burst script
        run: node scripts/burst.js http://localhost:8080 --admin-token ci-compose-admin-token --requests 5000 --concurrency 500
      - name: App logs (tail)
        if: always()
        run: docker compose logs app | tail -50
      - name: Tear down
        if: always()
        run: docker compose down -v
